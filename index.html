<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Lector Ágil</title>
    <style>
        /* --- RESET Y ESTILOS BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        :root {
            --bg: #f7f3ee;
            --text: #2c2c2c;
            --bar-bg: rgba(247, 243, 238, 0.92);
            --border: rgba(0, 0, 0, 0.06);
            --accent: #b8956a;
            --accent-light: rgba(184, 149, 106, 0.2);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background var(--transition), color var(--transition);
        }

        body.sepia {
            --bg: #f6edd8;
            --text: #3d352a;
            --bar-bg: rgba(246, 237, 216, 0.92);
            --border: rgba(61, 53, 42, 0.08);
        }
        body.dark {
            --bg: #18181c;
            --text: #d6d2cb;
            --bar-bg: rgba(24, 24, 28, 0.92);
            --border: rgba(255, 255, 255, 0.06);
            --accent: #c9a96e;
            --accent-light: rgba(201, 169, 110, 0.15);
        }

        #app {
            width: 100%;
            max-width: 700px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            transition: background var(--transition);
            position: relative;
            overflow: hidden;
        }

        /* UI envuelta en <aside> para evitar el modo lectura */
        #app-ui {
            display: contents;
        }

        /* --- BARRA SUPERIOR --- */
        #top-bar {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: var(--bar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition), transform var(--transition), opacity var(--transition);
            z-index: 20;
            flex-shrink: 0;
            min-height: 56px;
        }
        #top-bar.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.8rem;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            line-height: 1;
        }
        .menu-btn:hover {
            background: var(--accent-light);
        }

        /* --- ÁREA DE LECTURA --- */
        #reader {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 24px 24px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            background: var(--bg);
            transition: background var(--transition);
            line-height: 1.8;
            letter-spacing: 0.01em;
            word-break: break-word;
            font-family: 'Georgia', serif;
        }

        /* 🔥 SOLUCIÓN: los párrafos heredan el tamaño de #reader */
        #reader p {
            margin: 0 0 1.4em 0;
            text-align: justify;
            font-size: inherit; /* ← Aquí estaba el bloqueo */
            transition: font-size 0.1s ease;
        }

        /* --- BARRA INFERIOR --- */
        #bottom-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 16px;
            background: var(--bar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            transition: background var(--transition), transform var(--transition), opacity var(--transition);
            flex-shrink: 0;
            z-index: 20;
            min-height: 48px;
        }
        #bottom-bar.hidden {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        .progress-track {
            flex: 1;
            height: 3px;
            background: var(--border);
            border-radius: 4px;
            position: relative;
            overflow: visible;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.15s ease;
        }
        .bookmark-dot {
            position: absolute;
            top: -4px;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(184, 149, 106, 0.4);
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        .bookmark-dot.visible {
            opacity: 1;
            transform: scale(1);
        }

        .page-info {
            font-size: 0.7rem;
            opacity: 0.6;
            letter-spacing: 0.03em;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            min-width: 60px;
            text-align: right;
        }

        /* --- MENÚ LATERAL --- */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
        }
        .menu-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .menu-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            max-width: 80vw;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.15);
            transform: translateX(-100%);
            transition: transform var(--transition), background var(--transition);
            z-index: 101;
            padding: 24px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .menu-panel.open {
            transform: translateX(0);
        }

        .menu-panel h2 {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            opacity: 0.7;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 4px;
        }
        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .menu-section label {
            font-size: 0.8rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .font-size-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .font-size-control button {
            background: var(--border);
            border: none;
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.6rem;
            font-weight: 300;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            user-select: none;
        }
        .font-size-control button:active {
            transform: scale(0.88);
            background: var(--accent-light);
        }
        .font-size-control span {
            min-width: 50px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            transition: transform 0.15s;
        }
        .font-size-control span.pop {
            transform: scale(1.3);
        }

        .font-family-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .font-family-group button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 0 auto;
        }
        .font-family-group button.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
        }
        .theme-group {
            display: flex;
            gap: 8px;
        }
        .theme-group button {
            flex: 1;
            padding: 8px 0;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .theme-group button.active {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .theme-group button .preview {
            display: block;
            height: 18px;
            border-radius: 4px;
            margin: 4px auto 2px;
            width: 60%;
        }
        .theme-group button[data-theme="light"] .preview {
            background: #f7f3ee;
            border: 1px solid #ddd;
        }
        .theme-group button[data-theme="sepia"] .preview {
            background: #f6edd8;
            border: 1px solid #d4c9b0;
        }
        .theme-group button[data-theme="dark"] .preview {
            background: #18181c;
            border: 1px solid #444;
        }
        .bookmark-actions {
            display: flex;
            gap: 10px;
        }
        .bookmark-actions button {
            flex: 1;
            padding: 10px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .bookmark-actions button:active {
            transform: scale(0.96);
        }
        .bookmark-actions .save-bookmark {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
        }
        .close-menu {
            margin-top: auto;
            padding: 12px;
            border: none;
            background: var(--border);
            color: var(--text);
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .close-menu:active {
            background: var(--accent-light);
        }

        /* --- TOAST --- */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 200;
            backdrop-filter: blur(4px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Scrollbar */
        #reader::-webkit-scrollbar {
            width: 4px;
        }
        #reader::-webkit-scrollbar-track {
            background: transparent;
        }
        #reader::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            #reader {
                padding: 16px 18px;
            }
            .menu-panel {
                width: 260px;
                padding: 20px 16px;
            }
            .font-family-group button {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <aside id="app-ui">
            <header id="top-bar">
                <button class="menu-btn" id="menuToggle" aria-label="Menú">☰</button>
            </header>
            <footer id="bottom-bar">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                    <span class="bookmark-dot" id="bookmarkDot"></span>
                </div>
                <span class="page-info" id="pageInfo">Pág. 1</span>
            </footer>
            <div class="menu-overlay" id="menuOverlay"></div>
            <div class="menu-panel" id="menuPanel">
                <h2>Configuración</h2>
                <div class="menu-section">
                    <label>Tamaño de fuente</label>
                    <div class="font-size-control">
                        <button type="button" id="fontDec">−</button>
                        <span id="fontSizeDisplay">1.0</span>
                        <button type="button" id="fontInc">+</button>
                    </div>
                </div>
                <div class="menu-section">
                    <label>Tipo de fuente</label>
                    <div class="font-family-group" id="fontFamilyGroup">
                        <button data-font="georgia">Georgia</button>
                        <button data-font="times">Times</button>
                        <button data-font="arial">Arial</button>
                        <button data-font="verdana">Verdana</button>
                        <button data-font="palatino">Palatino</button>
                    </div>
                </div>
                <div class="menu-section">
                    <label>Tema</label>
                    <div class="theme-group" id="themeGroup">
                        <button data-theme="light">Claro <span class="preview"></span></button>
                        <button data-theme="sepia">Sepia <span class="preview"></span></button>
                        <button data-theme="dark">Oscuro <span class="preview"></span></button>
                    </div>
                </div>
                <div class="menu-section">
                    <label>Marcador</label>
                    <div class="bookmark-actions">
                        <button class="save-bookmark" id="saveBookmark">📌 Guardar</button>
                        <button id="goToBookmark">📍 Ir</button>
                    </div>
                </div>
                <button class="close-menu" id="closeMenu">Cerrar</button>
            </div>
        </aside>

        <main id="reader"></main>
        <div id="toast" class="toast"></div>
    </div>

    <script>
        (function() {
            'use strict';

            console.log('📖 Lector Ágil v2.6 - CSS heredado corregido');

            const FONT_MAP = {
                georgia: 'Georgia, serif',
                times: '"Times New Roman", serif',
                arial: 'Arial, sans-serif',
                verdana: 'Verdana, sans-serif',
                palatino: '"Palatino Linotype", "Book Antiqua", serif'
            };

            const reader = document.getElementById('reader');
            const topBar = document.getElementById('top-bar');
            const bottomBar = document.getElementById('bottom-bar');
            const progressFill = document.getElementById('progressFill');
            const pageInfo = document.getElementById('pageInfo');
            const bookmarkDot = document.getElementById('bookmarkDot');
            const menuToggle = document.getElementById('menuToggle');
            const menuOverlay = document.getElementById('menuOverlay');
            const menuPanel = document.getElementById('menuPanel');
            const closeMenu = document.getElementById('closeMenu');
            const fontDec = document.getElementById('fontDec');
            const fontInc = document.getElementById('fontInc');
            const fontSizeDisplay = document.getElementById('fontSizeDisplay');
            const fontFamilyGroup = document.getElementById('fontFamilyGroup');
            const themeGroup = document.getElementById('themeGroup');
            const saveBookmarkBtn = document.getElementById('saveBookmark');
            const goToBookmarkBtn = document.getElementById('goToBookmark');
            const toast = document.getElementById('toast');

            const state = {
                fontSize: 1.0,
                fontKey: 'georgia',
                theme: 'light',
                bookmark: null,
                scrollPercent: 0,
                menuOpen: false,
                barsVisible: true,
            };

            const MIN_FONT = 0.6;
            const MAX_FONT = 3.0;
            const FONT_STEP = 0.15;
            const STORAGE_KEY = 'lector_agile_config';

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const saved = JSON.parse(raw);
                    if (saved.fontSize !== undefined) state.fontSize = Math.min(MAX_FONT, Math.max(MIN_FONT, saved
                        .fontSize));
                    if (saved.fontKey && FONT_MAP[saved.fontKey]) state.fontKey = saved.fontKey;
                    if (saved.theme) state.theme = saved.theme;
                    if (saved.bookmark !== undefined) state.bookmark = saved.bookmark;
                    if (saved.scrollPercent !== undefined) state.scrollPercent = saved.scrollPercent;
                    return true;
                } catch (e) { return false; }
            }

            function saveState() {
                const data = {
                    fontSize: state.fontSize,
                    fontKey: state.fontKey,
                    theme: state.theme,
                    bookmark: state.bookmark,
                    scrollPercent: state.scrollPercent,
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function applyFontSize(size) {
                let newSize = Math.round(Math.min(MAX_FONT, Math.max(MIN_FONT, size)) * 10) / 10;
                state.fontSize = newSize;

                // Aplicar al contenedor; los párrafos heredan gracias a font-size: inherit
                reader.style.fontSize = state.fontSize + 'rem';

                fontSizeDisplay.textContent = state.fontSize.toFixed(1);
                fontSizeDisplay.classList.remove('pop');
                void fontSizeDisplay.offsetWidth;
                fontSizeDisplay.classList.add('pop');

                saveState();
                requestAnimationFrame(() => updateProgress());
                console.log('🔠 Tamaño:', state.fontSize);
                showToast(`Tamaño: ${state.fontSize.toFixed(1)}`);
            }

            function applyFontFamily(key) {
                if (!FONT_MAP[key]) return;
                state.fontKey = key;
                reader.style.fontFamily = FONT_MAP[key];
                document.querySelectorAll('#fontFamilyGroup button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.font === key);
                });
                saveState();
                showToast(`Fuente: ${key.charAt(0).toUpperCase() + key.slice(1)}`);
                requestAnimationFrame(() => updateProgress());
            }

            function applyTheme(theme) {
                document.body.className = theme === 'light' ? '' : theme;
                state.theme = theme;
                document.querySelectorAll('#themeGroup button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
                saveState();
            }

            function updateProgress() {
                const scrollTop = reader.scrollTop;
                const scrollHeight = reader.scrollHeight;
                const clientHeight = reader.clientHeight;

                if (scrollHeight <= clientHeight) {
                    progressFill.style.width = '100%';
                    pageInfo.textContent = 'Pág. 1';
                    return;
                }

                const maxScroll = scrollHeight - clientHeight;
                const percent = Math.min(1, scrollTop / maxScroll);
                progressFill.style.width = (percent * 100) + '%';

                const totalPages = Math.ceil(scrollHeight / clientHeight);
                const currentPage = Math.min(totalPages, Math.floor(scrollTop / clientHeight) + 1);
                pageInfo.textContent = `Pág. ${currentPage} de ${totalPages}`;

                if (state.bookmark !== null) {
                    const bmPercent = Math.min(1, Math.max(0, state.bookmark));
                    bookmarkDot.style.left = `calc(${bmPercent * 100}% - 4px)`;
                    bookmarkDot.classList.add('visible');
                } else {
                    bookmarkDot.classList.remove('visible');
                }

                state.scrollPercent = percent;
                saveState();
            }

            let scrollSaveTimer = null;

            function handleScroll() {
                updateProgress();
                if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
                scrollSaveTimer = setTimeout(() => {
                    saveState();
                    scrollSaveTimer = null;
                }, 400);
            }

            function restoreScrollPosition() {
                if (state.scrollPercent > 0) {
                    const maxScroll = reader.scrollHeight - reader.clientHeight;
                    reader.scrollTop = state.scrollPercent * maxScroll;
                }
                updateProgress();
            }

            function saveBookmark() {
                const scrollTop = reader.scrollTop;
                const scrollHeight = reader.scrollHeight;
                const clientHeight = reader.clientHeight;
                if (scrollHeight <= clientHeight) {
                    showToast('No hay suficiente texto');
                    return;
                }
                const maxScroll = scrollHeight - clientHeight;
                state.bookmark = Math.min(1, scrollTop / maxScroll);
                saveState();
                updateProgress();
                showToast('📌 Marcador guardado');
            }

            function goToBookmark() {
                if (state.bookmark === null) {
                    showToast('No hay marcador');
                    return;
                }
                const maxScroll = reader.scrollHeight - reader.clientHeight;
                reader.scrollTo({ top: state.bookmark * maxScroll, behavior: 'smooth' });
                showToast('📍 Ir al marcador');
            }

            async function loadBook() {
                try {
                    const url = 'libro.txt?t=' + Date.now();
                    console.log('📂 Cargando:', url);
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error('Error ' + resp.status + ': ' + resp.statusText);
                    const text = await resp.text();
                    const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim() !== '');
                    if (paragraphs.length === 0) {
                        reader.innerHTML = '<p><em>El libro está vacío.</em></p>';
                        return;
                    }
                    const html = paragraphs.map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
                    reader.innerHTML = html;

                    applyFontSize(state.fontSize);
                    applyFontFamily(state.fontKey);
                    applyTheme(state.theme);

                    requestAnimationFrame(() => {
                        void reader.offsetHeight;
                        restoreScrollPosition();
                    });

                    saveState();
                    console.log('✅ Libro cargado');
                } catch (err) {
                    reader.innerHTML =
                        `<p style="color: #b44; padding: 2rem; text-align: center;"><strong>Error:</strong> ${err.message}<br><br>Asegúrate de que <code>libro.txt</code> esté en la misma carpeta.</p>`;
                    console.error('❌ Error:', err);
                }
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function toggleMenu(open) {
                const newState = (open !== undefined) ? open : !state.menuOpen;
                state.menuOpen = newState;
                menuPanel.classList.toggle('open', newState);
                menuOverlay.classList.toggle('open', newState);
                document.body.style.overflow = newState ? 'hidden' : '';
            }

            let toastTimer = null;

            function showToast(msg, duration = 2000) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toast.classList.remove('show');
                }
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, duration);
            }

            function toggleBars() {
                state.barsVisible = !state.barsVisible;
                topBar.classList.toggle('hidden', !state.barsVisible);
                bottomBar.classList.toggle('hidden', !state.barsVisible);
            }

            reader.addEventListener('scroll', handleScroll, { passive: true });
            reader.addEventListener('click', toggleBars);

            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });
            menuOverlay.addEventListener('click', () => toggleMenu(false));
            closeMenu.addEventListener('click', () => toggleMenu(false));

            fontDec.addEventListener('click', function(e) {
                e.stopPropagation();
                applyFontSize(state.fontSize - FONT_STEP);
            });
            fontInc.addEventListener('click', function(e) {
                e.stopPropagation();
                applyFontSize(state.fontSize + FONT_STEP);
            });

            fontFamilyGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (btn) {
                    const key = btn.dataset.font;
                    if (key && FONT_MAP[key]) applyFontFamily(key);
                }
            });

            themeGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (btn) applyTheme(btn.dataset.theme);
            });

            saveBookmarkBtn.addEventListener('click', saveBookmark);
            goToBookmarkBtn.addEventListener('click', goToBookmark);

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => updateProgress(), 300);
            });

            window.addEventListener('beforeunload', () => saveState());

            function init() {
                loadState();
                topBar.classList.remove('hidden');
                bottomBar.classList.remove('hidden');
                state.barsVisible = true;

                document.body.className = state.theme === 'light' ? '' : state.theme;
                reader.style.fontSize = state.fontSize + 'rem';
                reader.style.fontFamily = FONT_MAP[state.fontKey] || 'Georgia, serif';
                fontSizeDisplay.textContent = state.fontSize.toFixed(1);

                document.querySelectorAll('#fontFamilyGroup button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.font === state.fontKey);
                });
                document.querySelectorAll('#themeGroup button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === state.theme);
                });

                loadBook();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
