<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="readability-verification" content="none" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lector Ágil</title>
  <style>
    /* Reset y variables */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f7f3ee;
      --text: #2c2c2c;
      --bar-bg: rgba(247, 243, 238, 0.92);
      --border: rgba(0,0,0,0.06);
      --accent: #b8956a;
      --accent-light: rgba(184, 149, 106, 0.2);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg) !important;
      color: var(--text) !important;
      font-family: 'Georgia', serif !important;
      display: flex !important;
      justify-content: center !important;
      min-height: 100vh !important;
      margin: 0 !important;
      transition: background var(--transition), color var(--transition);
    }

    body.sepia {
      --bg: #f6edd8 !important;
      --text: #3d352a !important;
      --bar-bg: rgba(246, 237, 216, 0.92) !important;
      --border: rgba(61, 53, 42, 0.08) !important;
    }

    body.dark {
      --bg: #18181c !important;
      --text: #d6d2cb !important;
      --bar-bg: rgba(24, 24, 28, 0.92) !important;
      --border: rgba(255,255,255,0.06) !important;
      --accent: #c9a96e !important;
      --accent-light: rgba(201, 169, 110, 0.15) !important;
    }

    #app {
      width: 100% !important;
      max-width: 700px !important;
      height: 100vh !important;
      height: 100dvh !important;
      display: flex !important;
      flex-direction: column !important;
      background: var(--bg) !important;
      transition: background var(--transition);
      position: relative !important;
      overflow: hidden !important;
    }

    #reader {
      flex: 1 !important;
      overflow-y: auto !important;
      padding: 20px 24px 24px 24px !important;
      scroll-behavior: smooth !important;
      -webkit-overflow-scrolling: touch !important;
      background: var(--bg) !important;
      transition: background var(--transition);
      line-height: 1.8 !important;
      letter-spacing: 0.01em !important;
      word-break: break-word !important;
      font-family: 'Georgia', serif !important;
    }

    #reader p {
      margin: 0 0 1.4em 0 !important;
      text-align: justify !important;
      font-size: 1rem !important;
      transition: font-size 0.15s ease !important;
    }

    /* Barra superior */
    #top-bar {
      display: flex !important;
      align-items: center !important;
      padding: 10px 16px !important;
      background: var(--bar-bg) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border-bottom: 1px solid var(--border) !important;
      transition: background var(--transition), transform var(--transition), opacity var(--transition);
      z-index: 20 !important;
      flex-shrink: 0 !important;
      min-height: 56px !important;
    }

    #top-bar.hidden {
      transform: translateY(-100%) !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .menu-btn {
      background: none !important;
      border: none !important;
      color: var(--text) !important;
      font-size: 1.8rem !important;
      padding: 4px 8px !important;
      cursor: pointer !important;
      border-radius: 8px !important;
      transition: background 0.2s;
      line-height: 1 !important;
      display: inline-block !important;
    }
    .menu-btn:hover {
      background: var(--accent-light) !important;
    }

    /* Barra inferior */
    #bottom-bar {
      display: flex !important;
      align-items: center !important;
      gap: 14px !important;
      padding: 8px 16px !important;
      background: var(--bar-bg) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border-top: 1px solid var(--border) !important;
      transition: background var(--transition), transform var(--transition), opacity var(--transition);
      flex-shrink: 0 !important;
      z-index: 20 !important;
      min-height: 48px !important;
    }

    #bottom-bar.hidden {
      transform: translateY(100%) !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .progress-track {
      flex: 1 !important;
      height: 3px !important;
      background: var(--border) !important;
      border-radius: 4px !important;
      position: relative !important;
      overflow: visible !important;
    }

    .progress-fill {
      height: 100% !important;
      width: 0% !important;
      background: var(--accent) !important;
      border-radius: 4px !important;
      transition: width 0.15s ease;
    }

    .bookmark-dot {
      position: absolute !important;
      top: -4px !important;
      width: 10px !important;
      height: 10px !important;
      background: var(--accent) !important;
      border-radius: 50% !important;
      box-shadow: 0 0 12px rgba(184, 149, 106, 0.4) !important;
      opacity: 0 !important;
      transform: scale(0.6) !important;
      transition: opacity 0.3s, transform 0.3s !important;
      pointer-events: none !important;
    }
    .bookmark-dot.visible {
      opacity: 1 !important;
      transform: scale(1) !important;
    }

    .page-info {
      font-size: 0.7rem !important;
      opacity: 0.6 !important;
      letter-spacing: 0.03em !important;
      white-space: nowrap !important;
      font-variant-numeric: tabular-nums !important;
      min-width: 60px !important;
      text-align: right !important;
    }

    /* Menú lateral */
    .menu-overlay {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0,0,0,0.3) !important;
      backdrop-filter: blur(3px) !important;
      -webkit-backdrop-filter: blur(3px) !important;
      z-index: 100 !important;
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity var(--transition);
    }
    .menu-overlay.open {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    .menu-panel {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 300px !important;
      max-width: 80vw !important;
      height: 100% !important;
      background: var(--bg) !important;
      color: var(--text) !important;
      box-shadow: 4px 0 30px rgba(0,0,0,0.15) !important;
      transform: translateX(-100%) !important;
      transition: transform var(--transition), background var(--transition);
      z-index: 101 !important;
      padding: 24px 20px !important;
      overflow-y: auto !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 24px !important;
    }
    .menu-panel.open {
      transform: translateX(0) !important;
    }

    .menu-panel h2 {
      font-size: 1.1rem !important;
      font-weight: 500 !important;
      letter-spacing: 0.05em !important;
      opacity: 0.7 !important;
      border-bottom: 1px solid var(--border) !important;
      padding-bottom: 12px !important;
      margin-bottom: 4px !important;
    }

    .menu-section {
      display: flex !important;
      flex-direction: column !important;
      gap: 10px !important;
    }

    .menu-section label {
      font-size: 0.8rem !important;
      opacity: 0.6 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.06em !important;
    }

    .font-size-control {
      display: flex !important;
      align-items: center !important;
      gap: 16px !important;
    }
    .font-size-control button {
      background: var(--border) !important;
      border: none !important;
      color: var(--text) !important;
      width: 40px !important;
      height: 40px !important;
      border-radius: 50% !important;
      font-size: 1.4rem !important;
      cursor: pointer !important;
      transition: background 0.2s, transform 0.1s !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      touch-action: manipulation !important;
      user-select: none !important;
    }
    .font-size-control button:active {
      transform: scale(0.90) !important;
    }
    .font-size-control span {
      min-width: 44px !important;
      text-align: center !important;
      font-size: 1.1rem !important;
      font-weight: 500 !important;
    }

    .font-family-group {
      display: flex !important;
      flex-wrap: wrap !important;
      gap: 6px !important;
    }
    .font-family-group button {
      background: transparent !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      padding: 6px 14px !important;
      border-radius: 20px !important;
      font-size: 0.8rem !important;
      cursor: pointer !important;
      transition: all 0.2s !important;
      flex: 1 0 auto !important;
    }
    .font-family-group button.active {
      border-color: var(--accent) !important;
      background: var(--accent-light) !important;
      color: var(--accent) !important;
    }

    .theme-group {
      display: flex !important;
      gap: 8px !important;
    }
    .theme-group button {
      flex: 1 !important;
      padding: 8px 0 !important;
      border: 2px solid var(--border) !important;
      border-radius: 8px !important;
      background: transparent !important;
      color: var(--text) !important;
      font-size: 0.8rem !important;
      cursor: pointer !important;
      transition: all 0.2s !important;
      text-align: center !important;
    }
    .theme-group button.active {
      border-color: var(--accent) !important;
      background: var(--accent-light) !important;
    }
    .theme-group button .preview {
      display: block !important;
      height: 18px !important;
      border-radius: 4px !important;
      margin: 4px auto 2px !important;
      width: 60% !important;
    }
    .theme-group button[data-theme="light"] .preview { background: #f7f3ee; border:1px solid #ddd; }
    .theme-group button[data-theme="sepia"] .preview { background: #f6edd8; border:1px solid #d4c9b0; }
    .theme-group button[data-theme="dark"] .preview { background: #18181c; border:1px solid #444; }

    .bookmark-actions {
      display: flex !important;
      gap: 10px !important;
    }
    .bookmark-actions button {
      flex: 1 !important;
      padding: 10px 0 !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      background: transparent !important;
      color: var(--text) !important;
      font-size: 0.85rem !important;
      cursor: pointer !important;
      transition: all 0.2s !important;
    }
    .bookmark-actions button:active {
      transform: scale(0.96) !important;
    }
    .bookmark-actions .save-bookmark {
      border-color: var(--accent) !important;
      background: var(--accent-light) !important;
      color: var(--accent) !important;
    }

    .close-menu {
      margin-top: auto !important;
      padding: 12px !important;
      border: none !important;
      background: var(--border) !important;
      color: var(--text) !important;
      border-radius: 8px !important;
      font-size: 0.9rem !important;
      cursor: pointer !important;
      transition: background 0.2s !important;
    }
    .close-menu:active {
      background: var(--accent-light) !important;
    }

    .toast {
      position: fixed !important;
      bottom: 80px !important;
      left: 50% !important;
      transform: translateX(-50%) translateY(20px) !important;
      background: rgba(0,0,0,0.78) !important;
      color: #fff !important;
      padding: 10px 24px !important;
      border-radius: 30px !important;
      font-size: 0.9rem !important;
      opacity: 0 !important;
      pointer-events: none !important;
      transition: all 0.3s ease !important;
      z-index: 200 !important;
      backdrop-filter: blur(4px) !important;
    }
    .toast.show {
      opacity: 1 !important;
      transform: translateX(-50%) translateY(0) !important;
    }

    #reader::-webkit-scrollbar {
      width: 4px !important;
    }
    #reader::-webkit-scrollbar-track {
      background: transparent !important;
    }
    #reader::-webkit-scrollbar-thumb {
      background: var(--accent) !important;
      border-radius: 8px !important;
    }

    @media (max-width: 480px) {
      #reader { padding: 16px 18px !important; }
      .menu-panel { width: 260px !important; padding: 20px 16px !important; }
      .font-family-group button { font-size: 0.7rem !important; padding: 4px 10px !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <button class="menu-btn" id="menuToggle" aria-label="Menú">☰</button>
    </header>

    <main id="reader"></main>

    <footer id="bottom-bar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <span class="bookmark-dot" id="bookmarkDot"></span>
      </div>
      <span class="page-info" id="pageInfo">Pág. 1</span>
    </footer>
  </div>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="menu-panel" id="menuPanel">
    <h2>Configuración</h2>

    <div class="menu-section">
      <label>Tamaño de fuente</label>
      <div class="font-size-control">
        <button type="button" id="fontDec">−</button>
        <span id="fontSizeDisplay">1.0</span>
        <button type="button" id="fontInc">+</button>
      </div>
    </div>

    <div class="menu-section">
      <label>Tipo de fuente</label>
      <div class="font-family-group" id="fontFamilyGroup">
        <button data-font="georgia">Georgia</button>
        <button data-font="times">Times</button>
        <button data-font="arial">Arial</button>
        <button data-font="verdana">Verdana</button>
        <button data-font="palatino">Palatino</button>
      </div>
    </div>

    <div class="menu-section">
      <label>Tema</label>
      <div class="theme-group" id="themeGroup">
        <button data-theme="light">Claro <span class="preview"></span></button>
        <button data-theme="sepia">Sepia <span class="preview"></span></button>
        <button data-theme="dark">Oscuro <span class="preview"></span></button>
      </div>
    </div>

    <div class="menu-section">
      <label>Marcador</label>
      <div class="bookmark-actions">
        <button class="save-bookmark" id="saveBookmark">📌 Guardar</button>
        <button id="goToBookmark">📍 Ir</button>
      </div>
    </div>

    <button class="close-menu" id="closeMenu">Cerrar</button>
  </aside>

  <div id="toast" class="toast"></div>

  <script>
    (function() {
      'use strict';

      console.log('📖 Lector Ágil v2.3 - Tamaño de texto corregido');

      // Mapeo de fuentes
      const FONT_MAP = {
        georgia: 'Georgia, serif',
        times: '"Times New Roman", serif',
        arial: 'Arial, sans-serif',
        verdana: 'Verdana, sans-serif',
        palatino: '"Palatino Linotype", "Book Antiqua", serif'
      };

      // DOM
      const reader = document.getElementById('reader');
      const topBar = document.getElementById('top-bar');
      const bottomBar = document.getElementById('bottom-bar');
      const progressFill = document.getElementById('progressFill');
      const pageInfo = document.getElementById('pageInfo');
      const bookmarkDot = document.getElementById('bookmarkDot');
      const menuToggle = document.getElementById('menuToggle');
      const menuOverlay = document.getElementById('menuOverlay');
      const menuPanel = document.getElementById('menuPanel');
      const closeMenu = document.getElementById('closeMenu');
      const fontDec = document.getElementById('fontDec');
      const fontInc = document.getElementById('fontInc');
      const fontSizeDisplay = document.getElementById('fontSizeDisplay');
      const fontFamilyGroup = document.getElementById('fontFamilyGroup');
      const themeGroup = document.getElementById('themeGroup');
      const saveBookmarkBtn = document.getElementById('saveBookmark');
      const goToBookmarkBtn = document.getElementById('goToBookmark');
      const toast = document.getElementById('toast');

      // Estado
      const state = {
        fontSize: 1.0,
        fontKey: 'georgia',
        theme: 'light',
        bookmark: null,
        scrollPercent: 0,
        barsVisible: true,
      };

      const MIN_FONT = 0.6;
      const MAX_FONT = 3.0;
      const FONT_STEP = 0.1;
      const STORAGE_KEY = 'lector_agile_config';

      // Persistencia
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const saved = JSON.parse(raw);
          if (saved.fontSize !== undefined) state.fontSize = Math.min(MAX_FONT, Math.max(MIN_FONT, saved.fontSize));
          if (saved.fontKey && FONT_MAP[saved.fontKey]) state.fontKey = saved.fontKey;
          if (saved.theme) state.theme = saved.theme;
          if (saved.bookmark !== undefined) state.bookmark = saved.bookmark;
          if (saved.scrollPercent !== undefined) state.scrollPercent = saved.scrollPercent;
          return true;
        } catch (e) { return false; }
      }

      function saveState() {
        const data = {
          fontSize: state.fontSize,
          fontKey: state.fontKey,
          theme: state.theme,
          bookmark: state.bookmark,
          scrollPercent: state.scrollPercent,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      // Aplicar tamaño con límites
      function applyFontSize(size) {
        let newSize = Math.min(MAX_FONT, Math.max(MIN_FONT, size));
        if (newSize === state.fontSize) return;
        state.fontSize = newSize;
        reader.style.fontSize = state.fontSize + 'rem';
        fontSizeDisplay.textContent = state.fontSize.toFixed(1);
        saveState();
        // Recalcular progreso (puede cambiar el alto)
        requestAnimationFrame(() => updateProgress());
        console.log('🔠 Tamaño fuente:', state.fontSize);
      }

      function applyFontFamily(key) {
        if (!FONT_MAP[key]) return;
        state.fontKey = key;
        reader.style.fontFamily = FONT_MAP[key];
        // Resaltar botón
        document.querySelectorAll('#fontFamilyGroup button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.font === key);
        });
        saveState();
        showToast(`Fuente: ${key.charAt(0).toUpperCase() + key.slice(1)}`);
        requestAnimationFrame(() => updateProgress());
      }

      function applyTheme(theme) {
        document.body.className = theme === 'light' ? '' : theme;
        state.theme = theme;
        document.querySelectorAll('#themeGroup button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.theme === theme);
        });
        saveState();
      }

      // Progreso
      function updateProgress() {
        const scrollTop = reader.scrollTop;
        const scrollHeight = reader.scrollHeight;
        const clientHeight = reader.clientHeight;

        if (scrollHeight <= clientHeight) {
          progressFill.style.width = '100%';
          pageInfo.textContent = 'Pág. 1';
          return;
        }

        const maxScroll = scrollHeight - clientHeight;
        const percent = Math.min(1, scrollTop / maxScroll);
        progressFill.style.width = (percent * 100) + '%';

        const totalPages = Math.ceil(scrollHeight / clientHeight);
        const currentPage = Math.min(totalPages, Math.floor(scrollTop / clientHeight) + 1);
        pageInfo.textContent = `Pág. ${currentPage} de ${totalPages}`;

        if (state.bookmark !== null) {
          const bmPercent = Math.min(1, Math.max(0, state.bookmark));
          bookmarkDot.style.left = `calc(${bmPercent * 100}% - 4px)`;
          bookmarkDot.classList.add('visible');
        } else {
          bookmarkDot.classList.remove('visible');
        }

        state.scrollPercent = percent;
        saveState();
      }

      let scrollSaveTimer = null;
      function handleScroll() {
        updateProgress();
        if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
        scrollSaveTimer = setTimeout(() => {
          saveState();
          scrollSaveTimer = null;
        }, 400);
      }

      function restoreScrollPosition() {
        if (state.scrollPercent > 0) {
          const maxScroll = reader.scrollHeight - reader.clientHeight;
          reader.scrollTop = state.scrollPercent * maxScroll;
        }
        updateProgress();
      }

      // Marcador
      function saveBookmark() {
        const scrollTop = reader.scrollTop;
        const scrollHeight = reader.scrollHeight;
        const clientHeight = reader.clientHeight;
        if (scrollHeight <= clientHeight) {
          showToast('No hay suficiente texto');
          return;
        }
        const maxScroll = scrollHeight - clientHeight;
        state.bookmark = Math.min(1, scrollTop / maxScroll);
        saveState();
        updateProgress();
        showToast('📌 Marcador guardado');
      }

      function goToBookmark() {
        if (state.bookmark === null) {
          showToast('No hay marcador');
          return;
        }
        const maxScroll = reader.scrollHeight - reader.clientHeight;
        reader.scrollTo({ top: state.bookmark * maxScroll, behavior: 'smooth' });
        showToast('📍 Ir al marcador');
      }

      // Cargar libro
      async function loadBook() {
        try {
          const url = 'libro.txt?t=' + Date.now();
          console.log('📂 Cargando:', url);
          const resp = await fetch(url);
          if (!resp.ok) throw new Error('Error ' + resp.status);
          const text = await resp.text();
          const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim() !== '');
          if (paragraphs.length === 0) {
            reader.innerHTML = '<p><em>El libro está vacío.</em></p>';
            return;
          }
          reader.innerHTML = paragraphs.map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');

          // Aplicar estilos guardados
          applyFontSize(state.fontSize);
          applyFontFamily(state.fontKey);
          applyTheme(state.theme);

          requestAnimationFrame(() => {
            void reader.offsetHeight;
            restoreScrollPosition();
          });

          saveState();
        } catch (err) {
          reader.innerHTML = `<p style="color: #b44;"><strong>Error:</strong> ${err.message}</p>`;
          console.error('❌ Error:', err);
        }
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Menú
      function toggleMenu(open) {
        const newState = (open !== undefined) ? open : !state.menuOpen;
        state.menuOpen = newState;
        menuPanel.classList.toggle('open', newState);
        menuOverlay.classList.toggle('open', newState);
        document.body.style.overflow = newState ? 'hidden' : '';
      }

      // Toast
      let toastTimer = null;
      function showToast(msg, duration = 2000) {
        if (toastTimer) {
          clearTimeout(toastTimer);
          toast.classList.remove('show');
        }
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
          toastTimer = null;
        }, duration);
      }

      // Ocultar barras
      function toggleBars() {
        state.barsVisible = !state.barsVisible;
        topBar.classList.toggle('hidden', !state.barsVisible);
        bottomBar.classList.toggle('hidden', !state.barsVisible);
      }

      // Eventos
      reader.addEventListener('scroll', handleScroll, { passive: true });
      reader.addEventListener('click', toggleBars);

      menuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMenu();
      });
      menuOverlay.addEventListener('click', () => toggleMenu(false));
      closeMenu.addEventListener('click', () => toggleMenu(false));

      // Botones de tamaño - con comprobación
      fontDec.addEventListener('click', function(e) {
        e.stopPropagation();
        applyFontSize(state.fontSize - FONT_STEP);
      });
      fontInc.addEventListener('click', function(e) {
        e.stopPropagation();
        applyFontSize(state.fontSize + FONT_STEP);
      });

      fontFamilyGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (btn) {
          const key = btn.dataset.font;
          if (key && FONT_MAP[key]) applyFontFamily(key);
        }
      });

      themeGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (btn) applyTheme(btn.dataset.theme);
      });

      saveBookmarkBtn.addEventListener('click', saveBookmark);
      goToBookmarkBtn.addEventListener('click', goToBookmark);

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => updateProgress(), 300);
      });

      window.addEventListener('beforeunload', () => saveState());

      // Inicio
      function init() {
        loadState();
        // Forzar visibilidad inicial
        topBar.classList.remove('hidden');
        bottomBar.classList.remove('hidden');
        state.barsVisible = true;

        // Aplicar estilos base
        document.body.className = state.theme === 'light' ? '' : state.theme;
        reader.style.fontSize = state.fontSize + 'rem';
        reader.style.fontFamily = FONT_MAP[state.fontKey] || 'Georgia, serif';
        fontSizeDisplay.textContent = state.fontSize.toFixed(1);

        // Resaltar botones activos
        document.querySelectorAll('#fontFamilyGroup button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.font === state.fontKey);
        });
        document.querySelectorAll('#themeGroup button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.theme === state.theme);
        });

        loadBook();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
