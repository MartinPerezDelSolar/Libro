<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lector de Texto</title>
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #f9f6f0;
            font-family: 'Literata', 'Georgia', serif;
            transition: background 0.4s ease, color 0.4s ease;
        }
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #f9f6f0;
            transition: background 0.4s ease;
            overflow: hidden;
        }
        #viewer {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 20px 10%;
            background: transparent;
            transition: padding 0.2s ease;
            font-size: 1.1em;
            line-height: 1.8;
            color: #2c2c2c;
            letter-spacing: 0.02em;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        @media (max-width: 480px) {
            #viewer { padding: 20px 6%; }
        }
        /* ===== BARRAS ===== */
        .bar {
            position: absolute;
            left: 0;
            right: 0;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(249, 246, 240, 0.75);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            transition: opacity 0.4s ease, transform 0.3s ease, background 0.4s ease;
            z-index: 50;
            border: none;
            user-select: none;
            min-height: 56px;
        }
        .bar.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-100%);
        }
        #top-bar {
            top: 0;
            border-bottom: 1px solid rgba(201, 169, 110, 0.15);
        }
        #bottom-bar {
            bottom: 0;
            border-top: 1px solid rgba(201, 169, 110, 0.15);
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        #book-title {
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            color: #3a3a3a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50vw;
            transition: color 0.3s ease;
        }
        .btn-icon {
            background: none;
            border: none;
            font-size: 1.5rem;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s ease;
            color: #5a4d3e;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
        }
        .btn-icon:active {
            transform: scale(0.90);
            background: rgba(201, 169, 110, 0.2);
        }
        #bookmark-btn {
            color: #b0a090;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #bookmark-btn.active {
            color: #c9a96e;
            transform: scale(1.1);
            text-shadow: 0 0 12px rgba(201, 169, 110, 0.3);
        }
        .font-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 40px;
            padding: 2px 6px;
        }
        .font-group .btn-icon {
            font-size: 1.2rem;
            min-width: 36px;
            min-height: 36px;
            padding: 0 6px;
            color: #4a3f33;
        }
        #font-size-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #7a6b5a;
            min-width: 28px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        #page-counter {
            font-size: 0.8rem;
            font-weight: 400;
            color: #7a6b5a;
            letter-spacing: 0.4px;
            background: rgba(0, 0, 0, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            white-space: nowrap;
            transition: color 0.3s ease;
        }
        #theme-toggle {
            font-size: 1.3rem;
        }
        /* ===== MODO OSCURO ===== */
        #app.dark-mode {
            background: #1a1a1e;
        }
        #app.dark-mode #viewer {
            color: #e8e4dd;
        }
        #app.dark-mode .bar {
            background: rgba(26, 26, 30, 0.82);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border-color: rgba(255, 255, 255, 0.06);
        }
        #app.dark-mode #book-title {
            color: #e0d6c8;
        }
        #app.dark-mode .btn-icon {
            color: #c0b6a8;
        }
        #app.dark-mode #page-counter {
            color: #a09888;
            background: rgba(255, 255, 255, 0.06);
        }
        #app.dark-mode .font-group {
            background: rgba(255, 255, 255, 0.07);
        }
        #app.dark-mode .font-group .btn-icon {
            color: #d0c8b8;
        }
        #app.dark-mode #font-size-label {
            color: #b0a898;
        }
        #app.dark-mode #bookmark-btn {
            color: #6a6050;
        }
        #app.dark-mode #bookmark-btn.active {
            color: #d4b87a;
            text-shadow: 0 0 20px rgba(212, 184, 122, 0.3);
        }
        /* ===== LOADER ===== */
        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: #f9f6f0;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            gap: 20px;
            text-align: center;
            padding: 20px;
        }
        #app.dark-mode #loader {
            background: #1a1a1e;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(201, 169, 110, 0.2);
            border-top: 3px solid #c9a96e;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loader p {
            font-size: 0.9rem;
            color: #7a6b5a;
            letter-spacing: 0.5px;
            max-width: 90%;
        }
        #loader .error {
            color: #b02a2a;
            font-weight: 500;
        }
        #loader .hint {
            font-size: 0.8rem;
            color: #7a6b5a;
            background: rgba(0,0,0,0.05);
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 90%;
            line-height: 1.6;
            margin: 10px 0;
        }
        #loader .hint code {
            background: rgba(0,0,0,0.08);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        .loader-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
        }
        .loader-buttons button {
            background: #c9a96e;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .loader-buttons button:hover {
            background: #b08a4e;
        }
        .loader-buttons .secondary {
            background: #6a6050;
        }
        .loader-buttons .secondary:hover {
            background: #5a5040;
        }
        #app.dark-mode #loader .hint {
            background: rgba(255,255,255,0.08);
            color: #b0a898;
        }
        #app.dark-mode #loader .hint code {
            background: rgba(255,255,255,0.15);
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .bar { padding: 10px 14px; min-height: 48px; }
            #book-title { font-size: 0.8rem; max-width: 35vw; }
            .btn-icon { font-size: 1.3rem; min-width: 38px; min-height: 38px; padding: 4px 6px; }
            #page-counter { font-size: 0.7rem; padding: 2px 10px; }
            .font-group .btn-icon { font-size: 1.0rem; min-width: 30px; min-height: 30px; }
            #viewer { padding: 16px 5%; }
        }
        @supports (padding-top: env(safe-area-inset-top)) {
            #top-bar { padding-top: calc(14px + env(safe-area-inset-top)); }
            #bottom-bar { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- LOADER -->
    <div id="loader">
        <div class="spinner" id="loader-spinner"></div>
        <p id="loader-message">Cargando el libro...</p>
        <div id="loader-hint" class="hint" style="display:none;"></div>
        <div class="loader-buttons">
            <button id="btn-upload" class="secondary">📂 Cargar archivo de texto</button>
        </div>
        <input type="file" id="file-input" accept=".txt,.rtf,.text" style="display:none;">
    </div>

    <!-- BARRA SUPERIOR -->
    <div id="top-bar" class="bar">
        <span id="book-title">Mi libro</span>
        <button id="bookmark-btn" class="btn-icon" aria-label="Marcar posición">✦</button>
    </div>

    <!-- VISOR -->
    <div id="viewer"></div>

    <!-- BARRA INFERIOR -->
    <div id="bottom-bar" class="bar">
        <button id="theme-toggle" class="btn-icon" aria-label="Cambiar tema">🌙</button>
        <span id="page-counter">0%</span>
        <div class="font-group">
            <button id="font-decrease" class="btn-icon" aria-label="Reducir texto">A<sup>−</sup></button>
            <span id="font-size-label">1.0</span>
            <button id="font-increase" class="btn-icon" aria-label="Aumentar texto">A<sup>+</sup></button>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ============================
        //  REFERENCIAS
        // ============================
        const viewer = document.getElementById('viewer');
        const loader = document.getElementById('loader');
        const loaderMsg = document.getElementById('loader-message');
        const loaderHint = document.getElementById('loader-hint');
        const loaderSpinner = document.getElementById('loader-spinner');
        const titleEl = document.getElementById('book-title');
        const pageCounter = document.getElementById('page-counter');
        const bookmarkBtn = document.getElementById('bookmark-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const fontInc = document.getElementById('font-increase');
        const fontDec = document.getElementById('font-decrease');
        const fontSizeLabel = document.getElementById('font-size-label');
        const topBar = document.getElementById('top-bar');
        const bottomBar = document.getElementById('bottom-bar');
        const fileInput = document.getElementById('file-input');
        const btnUpload = document.getElementById('btn-upload');

        // ============================
        //  ESTADO
        // ============================
        const STORAGE_KEY = 'lector_text_state';
        let state = {
            fontSize: 1.0,
            theme: 'light',
            bookmark: 0,       // porcentaje (0-100)
            scrollPos: 0,      // posición en píxeles
            content: '',
            fileName: 'Mi libro',
        };

        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                state.fontSize = parsed.fontSize || 1.0;
                state.theme = parsed.theme || 'light';
                state.bookmark = parsed.bookmark || 0;
                state.scrollPos = parsed.scrollPos || 0;
                state.fileName = parsed.fileName || 'Mi libro';
            }
        } catch (_) {}

        // Aplicar tema
        if (state.theme === 'dark') {
            document.getElementById('app').classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        } else {
            themeToggle.textContent = '🌙';
        }

        // ============================
        //  FUNCIONES PRINCIPALES
        // ============================
        function showError(msg, hint) {
            loaderMsg.innerHTML = `<span class="error">⚠️ ${msg}</span>`;
            if (hint) {
                loaderHint.style.display = 'block';
                loaderHint.innerHTML = hint;
            } else {
                loaderHint.style.display = 'none';
            }
            loaderSpinner.style.display = 'none';
            console.error('❌ Error:', msg);
        }

        function clearLoader() {
            loaderMsg.innerHTML = 'Cargando libro...';
            loaderHint.style.display = 'none';
            loaderSpinner.style.display = 'block';
        }

        function loadText(content, fileName) {
            state.content = content;
            state.fileName = fileName || 'Texto sin nombre';
            titleEl.textContent = state.fileName.replace(/\.[^.]+$/, ''); // quitar extensión

            // Dividir en párrafos (por doble salto de línea o saltos de línea)
            // Mostramos con <br> para respetar saltos simples y párrafos con doble salto.
            const paragraphs = content.split(/\n\s*\n/);
            let html = paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
            viewer.innerHTML = html;

            // Restaurar scroll si existe
            if (state.scrollPos) {
                setTimeout(() => {
                    viewer.scrollTop = state.scrollPos;
                }, 50);
            }

            // Actualizar porcentaje
            updateCounter();

            // Ocultar loader
            loader.classList.add('hidden');

            // Guardar estado
            saveState();
        }

        function updateCounter() {
            if (!viewer.scrollHeight || viewer.clientHeight === 0) {
                pageCounter.textContent = '0%';
                return;
            }
            const maxScroll = viewer.scrollHeight - viewer.clientHeight;
            const current = viewer.scrollTop;
            const percent = maxScroll > 0 ? Math.round((current / maxScroll) * 100) : 0;
            pageCounter.textContent = percent + '%';
        }

        function applyFontSize() {
            viewer.style.fontSize = (1.1 * state.fontSize) + 'em';
            fontSizeLabel.textContent = state.fontSize.toFixed(1);
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    fontSize: state.fontSize,
                    theme: state.theme,
                    bookmark: state.bookmark,
                    scrollPos: viewer.scrollTop,
                    fileName: state.fileName,
                }));
            } catch (_) {}
        }

        // ============================
        //  MANEJO DEL ARCHIVO
        // ============================
        function fetchBookFromServer() {
            // Intentar cargar libro.txt o libro.rtf desde la misma carpeta
            const files = ['libro.txt', 'libro.rtf'];
            let tried = 0;
            let loaded = false;

            function tryNext() {
                if (loaded || tried >= files.length) {
                    if (!loaded) {
                        showError(
                            'No se encontró ningún archivo de texto.',
                            'Sube un archivo .txt o .rtf usando el botón "Cargar archivo de texto".'
                        );
                    }
                    return;
                }
                const file = files[tried];
                tried++;
                fetch(file)
                    .then(res => {
                        if (!res.ok) throw new Error('Not found');
                        return res.text();
                    })
                    .then(text => {
                        loaded = true;
                        loadText(text, file);
                    })
                    .catch(() => {
                        tryNext();
                    });
            }

            // También permitir parámetro en URL: ?book=nombre.txt
            const params = new URLSearchParams(window.location.search);
            const param = params.get('book');
            if (param) {
                fetch(param)
                    .then(res => {
                        if (!res.ok) throw new Error('Not found');
                        return res.text();
                    })
                    .then(text => {
                        loaded = true;
                        loadText(text, param);
                    })
                    .catch(() => {
                        // si falla, continuar con los predeterminados
                        tryNext();
                    });
            } else {
                tryNext();
            }
        }

        // ============================
        //  EVENTOS DE UI
        // ============================
        // Subir archivo manual
        btnUpload.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const content = ev.target.result;
                loadText(content, file.name);
                e.target.value = '';
            };
            reader.onerror = () => {
                showError('Error al leer el archivo.', 'Intenta con otro archivo.');
            };
            reader.readAsText(file);
        });

        // Marcador (bookmark)
        bookmarkBtn.addEventListener('click', () => {
            const maxScroll = viewer.scrollHeight - viewer.clientHeight;
            if (maxScroll <= 0) return;
            const percent = Math.round((viewer.scrollTop / maxScroll) * 100);
            state.bookmark = percent;
            // Guardar también la posición exacta para mejor precisión
            state.scrollPos = viewer.scrollTop;
            bookmarkBtn.classList.toggle('active', true);
            saveState();
            if (navigator.vibrate) navigator.vibrate(10);
            // Mostrar un feedback visual (parpadeo)
            bookmarkBtn.style.transform = 'scale(1.2)';
            setTimeout(() => { bookmarkBtn.style.transform = ''; }, 200);
        });

        // Restaurar marcador al cargar
        function restoreBookmark() {
            if (state.bookmark > 0 && viewer.scrollHeight > viewer.clientHeight) {
                const maxScroll = viewer.scrollHeight - viewer.clientHeight;
                const target = (state.bookmark / 100) * maxScroll;
                viewer.scrollTop = target;
                bookmarkBtn.classList.add('active');
                updateCounter();
            }
        }

        // Tema
        themeToggle.addEventListener('click', () => {
            const app = document.getElementById('app');
            if (state.theme === 'light') {
                state.theme = 'dark';
                app.classList.add('dark-mode');
                themeToggle.textContent = '☀️';
            } else {
                state.theme = 'light';
                app.classList.remove('dark-mode');
                themeToggle.textContent = '🌙';
            }
            saveState();
        });

        // Tamaño de fuente
        fontInc.addEventListener('click', () => {
            state.fontSize = Math.min(2.0, state.fontSize + 0.1);
            applyFontSize();
            saveState();
        });
        fontDec.addEventListener('click', () => {
            state.fontSize = Math.max(0.7, state.fontSize - 0.1);
            applyFontSize();
            saveState();
        });

        // Scroll: actualizar contador y guardar posición
        viewer.addEventListener('scroll', () => {
            updateCounter();
            state.scrollPos = viewer.scrollTop;
            // Guardar cada cierto tiempo (debounce)
            clearTimeout(window._scrollSave);
            window._scrollSave = setTimeout(() => saveState(), 500);
        });

        // Ocultar barras al tocar
        let barsTimeout = null;
        viewer.addEventListener('click', (e) => {
            if (e.target.closest('.btn-icon') || e.target.closest('a')) return;
            const isHidden = topBar.classList.contains('hidden');
            topBar.classList.toggle('hidden', !isHidden);
            bottomBar.classList.toggle('hidden', !isHidden);
            clearTimeout(barsTimeout);
            if (!topBar.classList.contains('hidden')) {
                barsTimeout = setTimeout(() => {
                    topBar.classList.add('hidden');
                    bottomBar.classList.add('hidden');
                }, 4500);
            }
        });

        // Auto-ocultar barras al inicio
        setTimeout(() => {
            topBar.classList.add('hidden');
            bottomBar.classList.add('hidden');
        }, 3000);

        // Inicializar
        applyFontSize();
        fetchBookFromServer();

        // Cuando el contenido se haya cargado, restaurar bookmark y posición
        // (se llama desde loadText)
        const origLoad = loadText;
        loadText = function(content, fileName) {
            origLoad(content, fileName);
            // Restaurar bookmark después de que el contenido esté visible
            setTimeout(restoreBookmark, 100);
        };

        // Recalcular porcentaje al redimensionar
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                updateCounter();
                saveState();
            }, 300);
        });

        console.log('📖 Lector de texto inicializado.');
    })();
</script>
</body>
</html>
